<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Finance Analyzer — Input</title>
	<link rel="stylesheet" href="/static/style.css">
	<style>/* small override for form width */
		.panel {max-width:820px;margin:auto}
	</style>
</head>
<body>
	<main class="panel">
		<header class="site-header">
			<div class="site-title">Finance Analyzer</div>
			<div class="toolbar">
				<button id="themeToggle" class="icon-btn" title="Toggle between light and dark theme" aria-label="Toggle theme">
					<svg class="icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 3v2M12 19v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
				</button>
			</div>
		</header>

		<form id="analyzeForm" action="/analyze" method="post" class="card" onsubmit="return validateForm()">
			<div class="form-grid">
				<div>
					<label class="field">
						<span class="label">INCOME STREAM</span>
						<div class="inputInline">
							<input name="income" id="income" type="number" step="0.01" min="0" placeholder="0.00">
							<select name="currency" id="currency" class="unit-select">
								<option value="USD">USD</option>
								<option value="EUR">EUR</option>
								<option value="GBP">GBP</option>
								<option value="JPY">JPY</option>
								<option value="CAD">CAD</option>
								<option value="AUD">AUD</option>
								<option value="CHF">CHF</option>
								<option value="INR">INR</option>
								<option value="SGD">SGD</option>
								<option value="HKD">HKD</option>
							</select>
						</div>
					</label>

					<label class="field">
						<span class="label">FIXED OBLIGATIONS</span>
						<div class="inputInline">
							<input name="fixed" id="fixed" type="number" step="0.01" min="0" placeholder="0.00">
						</div>
					</label>

					<label class="field">
						<span class="label">INVESTMENT PROTOCOL</span>
						<select name="protocol" id="protocol" class="protocol-select">
							<option value="conservative">Conservative</option>
							<option value="balanced" selected>Balanced</option>
							<option value="aggressive">Aggressive</option>
						</select>
					</label>
				</div>

				<div>
					<label class="field">
						<span class="label">DAILY EXPENDITURE</span>
						<div class="inputInline">
							<input name="daily" id="daily" type="number" step="0.01" min="0" placeholder="0.00">
						</div>
					</label>

					<div class="field">
						<span class="label">VOLATILITY TOLERANCE</span>
						<div class="vol-pills">
							<input type="radio" id="vol-low" name="vol" value="low">
							<label for="vol-low">LOW</label>

							<input type="radio" id="vol-med" name="vol" value="medium" checked>
							<label for="vol-med">MEDIUM</label>

							<input type="radio" id="vol-high" name="vol" value="high">
							<label for="vol-high">HIGH</label>
						</div>
					</div>

					<div style="margin-top:10px;color:var(--muted);font-size:0.95rem">Tip: enter monthly figures or daily spending to compute monthly totals.</div>
				</div>
			</div>

			<div class="actions">
				<a href="/" class="secondary">Reset</a>
				<button type="submit" class="primary">INITIATE ANALYSIS</button>
			</div>
		</form>

		<script>
			function validateForm(){
				const income = parseFloat(document.getElementById('income').value || 0);
				if(income <= 0){
					alert('Please enter a valid income amount');
					return false;
				}
				return true;
			}
			(function(){
				const btn = document.getElementById('themeToggle');
				const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
				const saved = localStorage.getItem('theme');
				function applyTheme(t){
					if(t === 'dark'){document.body.classList.add('dark');} else {document.body.classList.remove('dark');}
				}
				applyTheme(saved || (prefersDark? 'dark':'light'));
				btn.addEventListener('click', ()=>{
					const now = document.body.classList.toggle('dark') ? 'dark' : 'light';
					localStorage.setItem('theme', now);
				});
			})();
		</script>

		<footer class="note">All fields accept decimal values. Analysis runs client-side and opens a results page.</footer>
	</main>

</body>
</html>
